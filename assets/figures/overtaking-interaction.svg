<svg xmlns="http://www.w3.org/2000/svg" width="600" height="448" viewBox="0 0 600 448" role="img" aria-labelledby="title description">
  <title id="title">An intended overtaking manoeuvre in interacting traffic</title>
  <desc id="description">Illustrative three-lane road with all traffic travelling upwards. The AI-controlled ego intends to change into the adjacent lane to pass stationary car2. Policy-controlled car1 approaches from behind in that adjacent lane. A dashed teal arrow shows the intended ego manoeuvre and a solid amber arrow shows the approach of car1; no collision outcome is prescribed.</desc>
  <defs>
    <pattern id="background-dots" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#bed1c5" opacity=".4"/>
    </pattern>
    <linearGradient id="road-surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d8e7de"/>
      <stop offset="1" stop-color="#c4dbce"/>
    </linearGradient>
    <linearGradient id="vehicle-shine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="vehicle-shadow" x="-50%" y="-30%" width="200%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#274d42" flood-opacity=".19"/>
    </filter>
    <marker id="ego-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M2 2 10 6 2 10" fill="none" stroke="#237b70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="traffic-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M2 2 10 6 2 10" fill="none" stroke="#ae7745" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="direction-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 2 10 6 2 10" fill="none" stroke="#8fae9c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="vehicle">
      <g fill="#1d3e37" opacity=".75">
        <rect x="-22" y="-20" width="5" height="14" rx="2"/>
        <rect x="17" y="-20" width="5" height="14" rx="2"/>
        <rect x="-22" y="12" width="5" height="14" rx="2"/>
        <rect x="17" y="12" width="5" height="14" rx="2"/>
      </g>
      <rect x="-18" y="-33" width="36" height="66" rx="11" fill="currentColor"/>
      <rect x="-18" y="-33" width="36" height="66" rx="11" fill="url(#vehicle-shine)"/>
      <path d="M-12-20 Q0-25 12-20 L10-7 Q0-10-10-7Z" fill="#eff7f0" opacity=".76"/>
      <path d="M-10 16 Q0 19 10 16 L11 25 Q0 29-11 25Z" fill="#eff7f0" opacity=".49"/>
      <path d="M-12-28-8-29 M8-29 12-28" stroke="#eff8ed" stroke-width="3" stroke-linecap="round"/>
      <path d="M-13 30-9 31 M9 31 13 30" stroke="#e5b28d" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="600" height="448" fill="#edf3ef"/>
  <rect width="600" height="448" fill="url(#background-dots)"/>

  <!-- The same affine transform keeps all three lanes, vehicles and paths aligned. -->
  <g transform="matrix(1 0 -.32 1 170 27)">
    <rect x="-9" y="0" width="318" height="356" fill="#dce8df"/>
    <rect x="0" y="0" width="300" height="356" fill="url(#road-surface)"/>
    <path d="M0 0V356 M300 0V356" stroke="#86af9b" stroke-width="2"/>
    <path d="M100 0V356 M200 0V356" stroke="#f6faf4" stroke-width="3" stroke-dasharray="15 14"/>

    <!-- Intent is illustrative: the test does not prescribe the actual ADS trajectory. -->
    <path d="M250 200 V185 C250 164 150 166 150 129 V37" fill="none" stroke="#f0f8f1" stroke-width="12" stroke-linecap="round"/>
    <path d="M250 200 V185 C250 164 150 166 150 129 V37" fill="none" stroke="#237b70" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" marker-end="url(#ego-arrow)"/>
    <path d="M150 257 V190" fill="none" stroke="#ae7745" stroke-width="4" stroke-linecap="round" marker-end="url(#traffic-arrow)"/>

    <ellipse cx="250" cy="235" rx="31" ry="44" fill="#237b70" opacity=".08"/>
    <g filter="url(#vehicle-shadow)">
      <use href="#vehicle" transform="translate(250 235)" color="#195c59"/>
      <use href="#vehicle" transform="translate(150 295)" color="#c2905f"/>
      <use href="#vehicle" transform="translate(250 87)" color="#82968b"/>
    </g>
  </g>

  <!-- Short, vehicle-attached labels stay horizontal for legibility. -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <path d="M48 141 66 85" fill="none" stroke="#8fae9c" stroke-width="2" marker-end="url(#direction-arrow)"/>
    <text x="30" y="59" font-size="13" font-weight="600" letter-spacing="1.4" fill="#718e7e">TRAVEL</text>
    <text x="30" y="77" font-size="13" fill="#718e7e">direction</text>

    <path d="M414 114 438 103H453" fill="none" stroke="#9aafa1" stroke-width="1.5"/>
    <circle cx="414" cy="114" r="2.5" fill="#82968b"/>
    <text x="462" y="104" font-size="20" font-weight="650" fill="#405d50">car2</text>
    <text x="462" y="126" font-size="15" fill="#6c8576">Stationary</text>

    <path d="M369 262 400 280H429" fill="none" stroke="#74a398" stroke-width="1.5"/>
    <circle cx="369" cy="262" r="2.5" fill="#237b70"/>
    <text x="441" y="281" font-size="20" font-weight="700" fill="#195c59">Ego</text>
    <text x="441" y="303" font-size="15" fill="#547c6c">AI-controlled</text>

    <path d="M211 355 199 393H163" fill="none" stroke="#b59473" stroke-width="1.5"/>
    <circle cx="211" cy="355" r="2.5" fill="#ae7745"/>
    <text x="49" y="394" font-size="20" font-weight="650" fill="#8f613c">car1</text>
    <text x="49" y="416" font-size="15" fill="#8b7860">Policy-controlled</text>
  </g>
</svg>
